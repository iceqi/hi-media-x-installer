# HiMediaX 全量 Docker Compose 模板
services:
  hi-media-x:
    image: ${HIMEDIAX_IMAGE:-iceqi/hi-media-x:latest}
    container_name: ${HIMEDIAX_CONTAINER_NAME:-hi-media-x}
    environment:
      HIMEDIAX_DATA_ROOT: /app/data
      HIMEDIAX_LIBRARY_ROOT: /app/library
      HIMEDIAX_HTTP_ADDRESS: ":8080"
      HIMEDIAX_WEBDAV_ADDRESS: ":8081"
      HIMEDIAX_PROXY_ADDRESS: ":8085"
      HIMEDIAX_JWT_SECRET: "${HIMEDIAX_JWT_SECRET:?set HIMEDIAX_JWT_SECRET}"
      HIMEDIAX_CONTROLLER_URL: "${HIMEDIAX_CONTROLLER_URL:-http://hi-media-x-controller:19090}"
      HIMEDIAX_CONTROLLER_TOKEN: "${HIMEDIAX_CONTROLLER_TOKEN:?set HIMEDIAX_CONTROLLER_TOKEN}"
      HIMEDIAX_GUESSIT_URL: "${HIMEDIAX_GUESSIT_URL:-http://hi-media-x-guessit:18084}"
    ports:
      - "${HIMEDIAX_HTTP_PORT:-18080}:8080"
      - "${HIMEDIAX_WEBDAV_PORT:-18081}:8081"
      - "${HIMEDIAX_PROXY_PORT:-18096}:8085"
    volumes:
      - "${HIMEDIAX_DATA_DIR_HOST:?set HIMEDIAX_DATA_DIR_HOST}:/app/data"
      - "${HIMEDIAX_LIBRARY_DIR_HOST:?set HIMEDIAX_LIBRARY_DIR_HOST}:/app/library"
    depends_on:
      - hi-media-x-controller
      - hi-media-x-guessit
    restart: unless-stopped
    networks: [himediax]
  hi-media-x-controller:
    image: ${HIMEDIAX_CONTROLLER_IMAGE:-iceqi/hi-media-x-controller:latest}
    container_name: ${HIMEDIAX_CONTROLLER_CONTAINER_NAME:-hi-media-x-controller}
    environment:
      HIMEDIAX_CONTROLLER_ADDRESS: ":19090"
      HIMEDIAX_CONTROLLER_TOKEN: "${HIMEDIAX_CONTROLLER_TOKEN:?set HIMEDIAX_CONTROLLER_TOKEN}"
      HIMEDIAX_XIAOYA_CONFIG_DIR: /xiaoya
      HIMEDIAX_DOCKER_SOCKET: /var/run/docker.sock
      HIMEDIAX_XIAOYA_CONTAINER: "${HIMEDIAX_XIAOYA_CONTAINER:-xiaoya-alist}"
      HIMEDIAX_HOST_ADDRESSES_FILE: /etc/himedia/config/HIMEDIAX_HOST_ADDRESSES
      HIMEDIAX_ADVERTISED_ADDRESSES: "${HIMEDIAX_ADVERTISED_ADDRESSES:-}"
      HIMEDIAX_APP_URL: "${HIMEDIAX_APP_URL:-http://hi-media-x:8080}"
    ports:
      - "${HIMEDIAX_CONTROLLER_PORT:-19090}:19090"
    volumes:
      - "${HIMEDIAX_XIAOYA_DATA_DIR:?set HIMEDIAX_XIAOYA_DATA_DIR}:/xiaoya"
      - "${HIMEDIAX_XIAOYA_CONFIG_DIR_HOST:?set HIMEDIAX_XIAOYA_CONFIG_DIR_HOST}:/etc/himedia/config:ro"
      - "${HIMEDIAX_CONTROLLER_DIR:?set HIMEDIAX_CONTROLLER_DIR}:/controller:ro"
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [himediax]
  hi-media-x-guessit:
    image: ${HIMEDIAX_GUESSIT_IMAGE:-iceqi/hi-media-x-guessit:latest}
    container_name: ${HIMEDIAX_GUESSIT_CONTAINER_NAME:-hi-media-x-guessit}
    environment:
      HIMEDIAX_GUESSIT_ADDRESS: ":18084"
    ports:
      - "${HIMEDIAX_GUESSIT_PORT:-18084}:18084"
    restart: unless-stopped
    networks: [himediax]
networks:
  himediax:
    name: ${HIMEDIAX_NETWORK_NAME:-himediax}

